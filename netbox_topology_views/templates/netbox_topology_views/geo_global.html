{% extends 'generic/_base.html' %}
{% load static %}

{% block title %}Global Geographic Map{% endblock %}

{% block head %}
<style>
  #geo-canvas {
    width: 100%;
    background: #1a2a3a;
    border-radius: 4px;
  }
  .geo-wrapper { position: relative; }

  /* ── Legend (bottom-left) ─────────────────────────── */
  #geo-legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    padding: 10px 14px;
    font-size: 12px;
    background: rgba(15,25,40,0.88);
    color: #ccc;
    border-radius: 6px;
    min-width: 155px;
    max-height: 340px;
    overflow-y: auto;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .geo-legend-title {
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #fff;
    margin-bottom: 6px;
  }
  .geo-legend-subtitle {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .05em;
    opacity: .6;
    margin-top: 2px;
    margin-bottom: 4px;
  }
  .geo-legend-divider {
    border-top: 1px solid rgba(255,255,255,.12);
    margin: 6px 0;
  }
  .geo-legend-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .geo-legend-row:last-child { margin-bottom: 0; }
  .geo-legend-swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  /* Border-style swatch for site-type tags */
  .geo-legend-swatch-border {
    background: transparent !important;
    border: 2.5px solid;
  }
  .geo-legend-note {
    font-size: 10px;
    opacity: .6;
    margin-top: 5px;
  }

  /* ── Site-type filter panel (bottom-right) ────────── */
  #geo-filter-panel {
    position: absolute;
    bottom: 16px;
    right: 16px;
    z-index: 10;
    padding: 10px 14px;
    font-size: 12px;
    background: rgba(15,25,40,0.88);
    color: #ccc;
    border-radius: 6px;
    min-width: 170px;
    max-height: 340px;
    overflow-y: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .geo-filter-title {
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #fff;
    margin-bottom: 5px;
  }
  .geo-filter-note {
    font-size: 10px;
    opacity: .6;
    margin-bottom: 6px;
  }
  .geo-filter-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 5px;
  }
  .geo-filter-label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    margin: 0;
    user-select: none;
    white-space: nowrap;
  }
  .geo-filter-actions {
    margin-top: 7px;
    font-size: 11px;
    opacity: .7;
  }
  .geo-filter-actions a { color: #8ab4d4; }
  .geo-filter-actions a:hover { color: #fff; }
</style>
{% endblock %}

{% block controls %}
<div class="controls">
  <div class="control-group">
    <a href="{% url 'dcim:site_list' %}" class="btn btn-secondary btn-sm">
      <i class="mdi mdi-format-list-bulleted"></i> All Sites
    </a>
    <button type="button" class="btn btn-secondary btn-sm"
            onclick="window._geoNetwork && window._geoNetwork.fit({animation:true})">
      <i class="mdi mdi-fit-to-screen"></i> Fit
    </button>

    <div class="input-group input-group-sm" style="width:auto">
      <span class="input-group-text"><i class="mdi mdi-resize"></i> Size by</span>
      <select id="geo-size-by" class="form-select form-select-sm" style="width:150px">
        <option value="none">Fixed</option>
        <option value="device_count">Device Count</option>
        <option value="circuit_count">Circuit Count</option>
      </select>
    </div>

    <div class="input-group input-group-sm" style="width:auto">
      <span class="input-group-text"><i class="mdi mdi-palette"></i> Colour by</span>
      <select id="geo-color-by" class="form-select form-select-sm" style="width:150px">
        <option value="region">Region</option>
        <option value="status">Site Status</option>
        <option value="tag">Primary Tag</option>
      </select>
    </div>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="geo-wrapper">
  <div id="geo-canvas"></div>
  <div id="geo-legend"><div class="geo-legend-title">Legend</div></div>
  <div id="geo-filter-panel"></div>
</div>
{% endblock %}

{% block javascript %}
<script>
  window.GEO_DATA = {{ geo_data|safe }};
  window.GEO_SITE_BASE_URL = "/" + "{{ settings.BASE_PATH }}" + "plugins/netbox_topology_views/geo/site/";
  window.WORLD_MAP_URL = "{% static 'netbox_topology_views/img/world_map.svg' %}";

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function resizeCanvas() {
    const subtract = ['.page-header', '.footer'].reduce(function (acc, sel) {
      const el = document.querySelector(sel);
      return acc + (el ? el.offsetHeight : 0);
    }, 60);
    document.getElementById('geo-canvas').style.height =
      Math.max(window.innerHeight - subtract, 400) + 'px';
  }
</script>
<script src="{% static 'netbox_topology_views/js/vis-network.min.js' %}"></script>
<script src="{% static 'netbox_topology_views/js/geo_global.js' %}"></script>
{% endblock %}
